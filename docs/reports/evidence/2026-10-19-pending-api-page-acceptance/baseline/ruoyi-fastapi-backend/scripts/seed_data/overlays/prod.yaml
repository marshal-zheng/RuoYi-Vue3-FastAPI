# 生产环境数据
# Production environment overlay data

# =============================================================================
# 用户数据 - 生产环境（只有管理员）
# =============================================================================
users:
  - user_id: 1
    user_name: admin
    nick_name: 管理员
    dept_id: 103
    user_type: "00"
    email: admin@example.com
    phonenumber: "15888888888"
    sex: "1"
    avatar: ""
    password: "admin123"  # 明文密码，加载时会哈希处理（生产环境应该修改此密码）
    status: "0"
    del_flag: "0"
    login_ip: "127.0.0.1"
    remark: 管理员

# =============================================================================
# 用户角色关联
# =============================================================================
user_roles:
  - user_id: 1
    role_id: 1  # admin -> 超级管理员角色

# =============================================================================
# 用户岗位关联
# =============================================================================
user_posts:
  - user_id: 1
    post_id: 1  # admin -> 董事长

# =============================================================================
# 生产环境配置覆盖
# =============================================================================
configs:
  - config_key: sys.account.captchaEnabled
    config_value: "true"  # 生产环境开启验证码
