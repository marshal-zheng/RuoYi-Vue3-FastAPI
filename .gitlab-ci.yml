frontend-quality-gates:
  stage: test
  image: node:20
  script:
    - corepack enable
    - cd ruoyi-fastapi-frontend
    - yarn install --immutable
    - yarn api:generate
    - git diff --exit-code -- src/api/_generated ../shared/openapi.json
    - |
      openapi_drift="$(git status --porcelain -- src/api/_generated ../shared/openapi.json)"
      if [ -n "$openapi_drift" ]; then
        echo "$openapi_drift"
        exit 1
      fi
    - yarn lint:check
    - yarn type-check
    - yarn type-check:strict
    - bash scripts/check-mock-standards.sh
    - cd ..
    - bash scripts/check-mock-mainline.sh
    - cd ruoyi-fastapi-frontend
    - yarn test:run src/mocks/runtime src/mocks/contracts src/mocks/handlers/api-contract-schema.test.ts
    - yarn mock:contracts
    - yarn test:run
    - yarn build:prod
    - yarn build:demo-offline
    - bash ../scripts/check-mock-mainline.sh --require-dist

sensitive-db-check:
  stage: security
  image: python:3.11
  script:
    - pip install -r ruoyi-fastapi-backend/requirements.txt
    - python ruoyi-fastapi-backend/scripts/check_sensitive_data.py
  when: manual
  allow_failure: true

migration-drift-check:
  stage: test
  image: python:3.11
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_ROOT_HOST: "%"
    MYSQL_DATABASE: ruoyi_fastapi_ci
    DB_TYPE: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USERNAME: root
    DB_PASSWORD: root
    DB_DATABASE: ruoyi_fastapi_ci
    DB_WORKFLOW_MODE: migration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+$/'
  script:
    - echo "Running formal migration drift gate for MR/default/release pipelines"
    - pip install -r ruoyi-fastapi-backend/requirements.txt -r ruoyi-fastapi-backend/requirements-dev.txt
    - python ruoyi-fastapi-backend/scripts/check_migration_drift.py

architecture-regression-tests:
  stage: test
  image: python:3.11
  script:
    - pip install -r ruoyi-fastapi-backend/requirements.txt -r ruoyi-fastapi-backend/requirements-dev.txt
    - cd ruoyi-fastapi-backend
    - python -m pytest -q -n 0 --no-cov tests/unit/middlewares/test_idempotency_middleware.py tests/unit/middlewares/test_rate_limit_middleware.py tests/unit/middlewares/test_request_logging_middleware.py tests/unit/middlewares/test_prometheus_middleware.py tests/unit/utils/test_otel_tracing.py tests/unit/controllers/test_simulation_controller.py tests/unit/services/test_simulation_runtime_state.py tests/unit/services/test_simulation_multi_worker_smoke.py tests/unit/services/test_simulation_service.py tests/unit/services/test_project_service.py tests/unit/services/test_project_version_service.py tests/unit/services/test_protocol_service.py tests/unit/services/test_common_service.py tests/unit/services/test_device_service.py tests/unit/services/test_device_category_service.py tests/integration/test_core_modules.py tests/integration/test_error_handling_rfc7807.py tests/integration/test_otel_trace_correlation.py

security-regression-tests:
  stage: test
  image: python:3.11
  script:
    - pip install -r ruoyi-fastapi-backend/requirements.txt -r ruoyi-fastapi-backend/requirements-dev.txt
    - cd ruoyi-fastapi-backend
    - python -m pytest -q -n 0 --no-cov tests/unit/middlewares/test_rate_limit_middleware.py tests/unit/middlewares/test_idempotency_middleware.py tests/unit/middlewares/test_request_logging_middleware.py tests/unit/middlewares/test_csrf_guard_middleware.py tests/unit/middlewares/test_token_source_guard_middleware.py tests/unit/services/test_security_token_service.py
