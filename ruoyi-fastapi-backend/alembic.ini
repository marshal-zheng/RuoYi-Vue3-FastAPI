# Alembic 配置文件
# 数据库迁移工具配置

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板参数
prepend_sys_path = .

# 版本号命名格式 (使用简短的 revision ID + 描述)
# 开发时使用自动生成的短 ID，发布时可以手动指定版本号
file_template = %%(rev)s_%%(slug)s

# SQLAlchemy URL (从环境变量读取，此处留空)
# 实际URL在 alembic/env.py 中通过 config.env.py 获取
sqlalchemy.url = 

# 启用批量模式 (SQLite 需要)
# batch_mode = true

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# 迁移后自动格式化
# 使用项目已有 Ruff 格式化生成的迁移脚本，确保代码风格一致
[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME
