[pytest]
# Pytest configuration for RuoYi-FastAPI backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 8.0

# Add project root to Python path
pythonpath = .

# Async support
asyncio_mode = auto

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Coverage options
    --cov=module_admin
    --cov=utils
    --cov=config
    --cov-report=html:tests/coverage/html
    --cov-report=term-missing
    --cov-report=json:tests/coverage/coverage.json
    # Coverage thresholds
    --cov-fail-under=15
    # Warnings
    -W ignore::DeprecationWarning
    # Parallel execution
    -n auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests
    requires_db: Tests that require database tables

# Coverage options
[coverage:run]
source = module_admin,utils,config
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = tests/coverage/html
