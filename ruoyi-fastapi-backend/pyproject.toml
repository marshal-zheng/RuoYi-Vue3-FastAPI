[project]
name = "ruoyi-fastapi-backend"
version = "1.6.2"
description = "RuoYi-Vue3-FastAPI 后端服务"
requires-python = ">=3.11"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# 渐进式迁移配置
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true

# Pydantic mypy 插件配置
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# 旧代码暂时宽松处理
[[tool.mypy.overrides]]
module = [
    "module_admin.controller.*",
    "module_generator.*",
    "module_task.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "APScheduler.*",
    "passlib.*",
    "user_agents.*",
    "simpy.*",
    "docxtpl.*",
    "can.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "N",      # pep8-naming
    "PL",     # Pylint
    "PERF",   # Perflint
]
ignore = [
    "E501",   # line too long (由 line-length 控制)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "ARG001", # Unused function argument (FastAPI依赖注入常见)
    "ARG002", # Unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["module_admin", "module_generator", "module_task", "config", "utils", "exceptions", "middlewares"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/entity/do/*.py" = ["N815"]  # SQLAlchemy 模型字段命名
"**/entity/vo/*.py" = ["N815"]  # Pydantic 模型字段命名

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]
